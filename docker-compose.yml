services:
  backend:
    # image: 153.51.112.29:8081/adylkhanovtm-backend-docker/sandbox-backend:latest
    image: "${REPOSITORY_BACKEND:?Set GHCR repository}:${IMAGE_TAG:?Set image version}"
    env_file:
      - .env
    ports:
      - "8081:8081"
    networks:
      - adylkhanov-network
    restart: unless-stopped

  frontend:
    # image: 153.51.112.29:8081/adylkhanovtm-frontend-docker/sandbox-frontend:latest
    image: "${REPOSITORY_FRONTEND:?Set GHCR repository}:${IMAGE_TAG:?Set image version}"
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - adylkhanov-network
    restart: unless-stopped

networks:
  adylkhanov-network:
    driver: bridge
