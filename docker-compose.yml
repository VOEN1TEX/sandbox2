services:
  backend:
    image: 153.51.118.157:8081/adylkhanov-backend-docker/sandbox-bakend:latest
    env_file:
      - .env
    ports:
      - "8081:8081"
    networks:
      - adylkhanov-network
    restart: unless-stopped

  frontend:
    image: 153.51.118.157:8081/adylkhanov-frontend-docker/sandbox-bakend:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - adylkhanov-network
    restart: unless-stopped

networks:
  adylkhanov-network:
    driver: bridge
