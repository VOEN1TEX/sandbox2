name: CI Pipeline

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Версия для запуска руками.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.VERSION }}" ]; then
            echo "version=${{ github.event.inputs.VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    environment: VM
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker for insecure registry
        if: ${{ vars.NEXUS_HOST != '' }}
        env:
          NEXUS_HOST: ${{ vars.NEXUS_HOST }}
        run: |
          if [[ ! "$NEXUS_HOST" =~ ^[a-zA-Z0-9.-]+:[0-9]+$ ]]; then
            echo '::error::NEXUS_HOST must be host:port, without a scheme or repository path.'
            exit 1
          fi
          sudo mkdir -p /etc/docker
          if [ ! -e /etc/docker/daemon.json ]; then
            echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          fi
          DOCKERD_CONFIG=$(sudo jq --arg host "$NEXUS_HOST" '. + {"insecure-registries": (((.["insecure-registries"] // []) + [$host]) | unique)}' /etc/docker/daemon.json)
          echo "$DOCKERD_CONFIG" | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      - name: Verify Nexus HTTP connector and Docker configuration
        if: ${{ vars.NEXUS_HOST != '' }}
        env:
          NEXUS_HOST: ${{ vars.NEXUS_HOST }}
        run: |
          docker info --format '{{json .RegistryConfig.IndexConfigs}}' |
            jq -e --arg host "$NEXUS_HOST" '.[$host].Secure == false' >/dev/null || {
              echo '::error::The Docker daemon used by this job does not recognize NEXUS_HOST as an insecure registry.'
              exit 1
            }
          if ! status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' "http://$NEXUS_HOST/v2/"); then
            echo '::error::Nexus HTTP connector is unreachable. Check the listener, published container port, firewall and runner network access. Changing credentials will not fix a timeout.'
            exit 1
          fi
          case "$status" in
            200|401) echo "Docker Registry API is reachable (HTTP $status)." ;;
            *) echo "::error::Expected Docker Registry API HTTP 200 or 401, got $status. Check NEXUS_HOST and connector routing."; exit 1 ;;
          esac

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create BuildKit config for insecure registry
        if: ${{ vars.NEXUS_HOST != '' }}
        run: |
          cat <<EOF > /tmp/buildkitd.toml
          [registry."${{ vars.NEXUS_HOST }}"]
            http = true
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config: /tmp/buildkitd.toml
          
      - name: Login to Nexus Registry (HTTP)
        if: ${{ vars.NEXUS_HOST != '' }}
        env:
          NEXUS_HOST: ${{ vars.NEXUS_HOST }}
          NEXUS_REPO_USER: ${{ vars.NEXUS_REPO_USER }}
          NEXUS_REPO_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          printf '%s' "$NEXUS_REPO_PASS" | docker login "$NEXUS_HOST" -u "$NEXUS_REPO_USER" --password-stdin

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
            ${{ vars.NEXUS_HOST }}/adylkhanov-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/${{ matrix.component }}
          file: ./src/${{ matrix.component }}/Dockerfile
          push: true
          provenance: false 
          sbom: false 
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    environment: VM
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create and configure .env
        run: |
          echo "${{ vars.APP_ENV_FILE }}" > .env
          echo "" >> .env
          echo "VERSION=${{ needs.version.outputs.version }}" >> .env
          echo "IMAGE_TAG=${{ needs.version.outputs.version }}" >> .env
          echo "IMAGE_REGISTRY=${{ vars.NEXUS_HOST }}/adylkhanov" >> .env
          echo "REPOSITORY_BACKEND=${{ vars.NEXUS_HOST }}/adylkhanov-backend-docker/sandbox-backend" >> .env
          echo "REPOSITORY_FRONTEND=${{ vars.NEXUS_HOST }}/adylkhanov-frontend-docker/sandbox-frontend" >> .env

      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.VM_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy deployment files to VM
        run: |
          scp docker-compose.yml .env ${{ vars.VM_USER }}@${{ vars.VM_HOST }}:~/app/

      - name: Execute deployment via SSH
        run: |
          ssh ${{ vars.VM_USER }}@${{ vars.VM_HOST }} << 'EOF'
            cd ~/app
            
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            echo "${{ secrets.NEXUS_REPO_PASS }}" | docker login ${{ vars.NEXUS_HOST }} -u ${{ vars.NEXUS_REPO_USER }} --password-stdin
            
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
            
            echo "${{ needs.version.outputs.version }}" > version.txt
          EOF

      - name: Healthcheck
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" http://${{ vars.VM_HOST }}/health || (echo "Healthcheck failed!" && exit 1)
