name: CI Pipeline

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Версия для запуска руками.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.VERSION }}" ]; then
            echo "version=${{ github.event.inputs.VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    environment: VM
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker for insecure registry
        if: ${{ vars.NEXUS_HOST != '' }}
        run: |
          sudo mkdir -p /etc/docker
          if [ ! -e /etc/docker/daemon.json ]; then
            echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          fi
          DOCKERD_CONFIG=$(jq '. + {"insecure-registries":["${{ vars.NEXUS_HOST }}"]}' /etc/docker/daemon.json)
          echo "$DOCKERD_CONFIG" | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Nexus Registry
        if: ${{ vars.NEXUS_HOST != '' }}
        run: |
          echo "${{ secrets.NEXUS_REPO_PASS }}" | docker login ${{ vars.NEXUS_HOST }} -u ${{ vars.NEXUS_REPO_USER }} --password-stdin --tls-verify=false

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
            ${{ vars.NEXUS_HOST }}/adylkhanov-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    environment: VM
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create and configure .env
        run: |
          echo "${{ vars.APP_ENV_FILE }}" > .env
          echo "" >> .env
          echo "VERSION=${{ needs.version.outputs.version }}" >> .env
          echo "IMAGE_TAG=${{ needs.version.outputs.version }}" >> .env
          echo "IMAGE_REGISTRY=${{ vars.NEXUS_HOST }}/adylkhanov" >> .env
          echo "REPOSITORY_BACKEND=${{ vars.NEXUS_HOST }}/adylkhanov-backend-docker/sandbox-backend" >> .env
          echo "REPOSITORY_FRONTEND=${{ vars.NEXUS_HOST }}/adylkhanov-frontend-docker/sandbox-frontend" >> .env

      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.VM_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy deployment files to VM
        run: |
          scp docker-compose.yml .env deploy.sh ${{ vars.VM_USER }}@${{ vars.VM_HOST }}:~/app/

      - name: Execute deployment via SSH
        run: |
          ssh ${{ vars.VM_USER }}@${{ vars.VM_HOST }} << 'EOF'
            cd ~/app
            
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            echo "${{ secrets.NEXUS_REPO_PASS }}" | docker login ${{ vars.NEXUS_HOST }} -u ${{ vars.NEXUS_REPO_USER }} --password-stdin
            
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            
            echo "${{ needs.version.outputs.version }}" > version.txt
          EOF

      - name: Healthcheck
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" http://${{ vars.VM_HOST }}/health || (echo "Healthcheck failed!" && exit 1)
