name: CI Pipeline

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Версия для запуска руками.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Определение версии
        id: set_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.VERSION }}" ]; then
            echo "version=${{ github.event.inputs.VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    environment: VM
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      # - name: Конфигруация Docker
      #   if: ${{ vars.NEXUS_HOST != '' }}
      #   env:
      #     NEXUS_HOST: ${{ vars.NEXUS_HOST }}
      #   run: |
      #     sudo mkdir -p /etc/docker
      #     if [ ! -e /etc/docker/daemon.json ]; then
      #       echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
      #     fi
      #     DOCKERD_CONFIG=$(sudo jq --arg host "$NEXUS_HOST" '. + {"insecure-registries": (((.["insecure-registries"] // []) + [$host]) | unique)}' /etc/docker/daemon.json)
      #     echo "$DOCKERD_CONFIG" | sudo tee /etc/docker/daemon.json >/dev/null
      #     sudo systemctl restart docker

      # - name: Создание BuildKit
      #   if: ${{ vars.NEXUS_HOST != '' }}
      #   run: |
      #     cat <<EOF > /tmp/buildkitd.toml
      #     [registry."${{ vars.NEXUS_HOST }}"]
      #       http = true
      #     EOF

      - name: Установка Docker Buildx
        uses: docker/setup-buildx-action@v3
        # with:
        #   config: /tmp/buildkitd.toml

      # - name: Авторизация в Nexus Registry
      #   if: ${{ vars.NEXUS_HOST != '' }}
      #   env:
      #     NEXUS_HOST: ${{ vars.NEXUS_HOST }}
      #     NEXUS_REPO_USER: ${{ vars.NEXUS_REPO_USER }}
      #     NEXUS_REPO_PASS: ${{ secrets.NEXUS_REPO_PASS }}
      #   run: |
      #     printf '%s' "$NEXUS_REPO_PASS" | docker login "$NEXUS_HOST" -u "$NEXUS_REPO_USER" --password-stdin

      - name: Авторизация GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сбор Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/adylkhanovtm/sandbox-${{ matrix.component }}
          # Nexus image publication is disabled:
          # ${{ vars.NEXUS_HOST }}/adylkhanovtm-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Создание и отправка Docker image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VUE_APP_API_URL=http://${{ vars.VM_HOST }}:8081
          context: ./src/${{ matrix.component }}
          file: ./src/${{ matrix.component }}/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    environment: VM
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Проверка repository
        uses: actions/checkout@v4

      - name: Создание и конфигурация .env
        run: |
          echo "${{ vars.APP_ENV_FILE }}" > .env
          echo "" >> .env
          echo "VERSION=${{ needs.version.outputs.version }}" >> .env
          echo "IMAGE_TAG=${{ needs.version.outputs.version }}" >> .env
          echo "IMAGE_REGISTRY=ghcr.io/$owner" >> .env
          echo "REPOSITORY_BACKEND=ghcr.io/adylkhanovtm/sandbox-backend" >> .env
          echo "REPOSITORY_FRONTEND=ghcr.io/adylkhanovtm/sandbox-frontend" >> .env
          # echo "IMAGE_REGISTRY=${{ vars.NEXUS_HOST }}/adylkhanov" >> .env
          # echo "REPOSITORY_BACKEND=${{ vars.NEXUS_HOST }}/adylkhanovtm-backend-docker/sandbox-backend" >> .env
          # echo "REPOSITORY_FRONTEND=${{ vars.NEXUS_HOST }}/adylkhanovtm-frontend-docker/sandbox-frontend" >> .env

      - name: Усановка SSH ключей
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.VM_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Копирование задеплоинных файлов на виртуальную машину 
        run: |
          scp docker-compose.yml .env ${{ vars.VM_USER }}@${{ vars.VM_HOST }}:~/app/

      - name: Развертка задеплоенных файлов по SSH
        run: |
          ssh ${{ vars.VM_USER }}@${{ vars.VM_HOST }} << 'EOF'
            set -e
            cd ~/app

            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            # echo "${{ secrets.NEXUS_REPO_PASS }}" | docker login ${{ vars.NEXUS_HOST }} -u ${{ vars.NEXUS_REPO_USER }} --password-stdin

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f

            echo "${{ needs.version.outputs.version }}" > version.txt
          EOF

      - name: Проверка работоспособности
        env:
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 \
            --retry 5 --retry-delay 3 --retry-connrefused \
            --output /dev/null --write-out '%{http_code}\n' \
            "http://${VM_HOST}:8081/health"
